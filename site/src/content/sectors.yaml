# Sectors: shown as the six tiles on Home and Sectors, and as the detail sections on Sectors.
# List order = display order. `id` is the URL anchor (/sectors/#banking) and is referenced by hires.yaml.
# Use "\u00a0" (non-breaking space) to keep two words together on one line, e.g. "&\u00a0Financial".
# `icon` is a file in src/assets/icons-3d/ (rendered by tools/icons3d/render.py). `lead` is a person id from people.yaml.

- id: banking
  title: "Banking, Private Equity &\u00a0Financial Services"
  icon: bank
  lead: ashmita
  tags:
    - Investment banking
    - Wealth management
    - Private equity
    - Retail banking
    - Risk
  intro:
    - Our historic core practice. Banking and financial services has always been IQ’s core business, and our associates have worked in the sector themselves.
    - We identify and assess board members, CEOs and senior functional leaders, and the teams behind them. Our network of senior management runs across banks, private equity and financial institutions, and several managers we placed have gone on to the C‑suite.
  areas:
    - Investment banking
    - Asset and wealth management
    - Private equity
    - Retail and consumer banking
    - Risk management

